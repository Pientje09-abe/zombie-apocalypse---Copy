<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="main-title">home</title>
  <link rel="stylesheet" href="../css/index.css">
</head>

<body id="background" class="background-home">
  <div id="buttons" class="center">
    <ul>
      <li><a href="#home"><button id="back" class="menubuttons hide">back</button></a></li>
      <li><a href="#play"><button id="play" class="menubuttons play">Play</button></a></li>
      <li><a href="#customize-menu"><button id="customize" class="menubuttons customize">Customize</button></a></li>
      <li><a href="#credits-menu"><button id="credits" class="menubuttons credits">Credits</button></a></li>
      <li><a href="link to your site"><button id="exitgame" class="menubuttons exit-game">Exit Game</button></a></li>
    </ul>
  </div>
  <div class="play-menu hide" id="play-menu">
    <h1 class="title hide">Play Menu</h1>
    <div>
      <img class="play-image" data-character="red-mario" src="../images/mario_character_idle_blue_red_loop.gif" alt="Play Image">
      <img class="play-image hide" data-character="green-mario" src="../images/mario_character_idle_groen_geel_loop.gif" alt="Play Image">
      <img class="play-image hide" data-character="purple-mario" src="../images/mario_character_idle_paars_roze_loop.gif" alt="Play Image">
      <img class="play-image hide" data-character="green-trooper" src="../images/Idle_trooper_east.gif" alt="Play Image">
    </div>
    <div class="timing-buttons">
      <button id="timing-button" class="timing-button-red"></button>
    </div>
    <div id="enemy">
      <img class="enemy-image" data-character="green-trooper-enemy" src="../images/Idle_trooper_west.gif" alt="enemy Image">
    </div>
  </div>
  <div class="customize-menu hide" id="customize-menu">
  <h1 class="title"></h1>
  <ul id="character-options">
    <li><button class="optionbutton options" data-character="red-mario"><img class="character-image1" src="../images/mario_character_idle_blue_red_loop.gif" alt="red mario">red mario</button></li>
    <li><button class="optionbutton options" data-character="green-mario"><img class="character-image2" src="../images/mario_character_idle_groen_geel_loop.gif" alt="green mario">green mario</button></li>
    <li><button class="optionbutton options" data-character="purple-mario"><img class="character-image3" src="../images/mario_character_idle_paars_roze_loop.gif" alt="purple mario">purple mario</button></li>
    <li><button class="optionbutton options" data-character="green-trooper"><img class="character-image4" src="../images/Idle_trooper_east.gif" alt="green trooper">green trooper</button></li>
  </ul>
  <p id="result">None selected</p>
  </div>
  <div class="credits-menu hide" id="credits-menu">
    <h1 class="title">Credits Menu</h1>
    <h2 class="text"><br>Pientje09<br><br>Rubyfire</h2>
  </div>
  <script src="../js/hide.js"></script>
  <script src="../js/save.js"></script>

</body>
</html>
