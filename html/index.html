<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="main-title">home</title>
  <link rel="stylesheet" href="../css/index.css">
</head>

<body id="background" class="background-home">
  <div id="buttons" class="center">
    <ul>
      <li><a href="#home"><button id="back" class="menubuttons hide">back</button></a></li>
      <li><a href="#play"><button id="play" class="menubuttons play">Play</button></a></li>
      <li><a href="#customize-menu"><button id="customize" class="menubuttons customize">Customize</button></a></li>
      <li><a href="#credits-menu"><button id="credits" class="menubuttons credits">Credits</button></a></li>
      <li><a href="link to your site"><button id="exitgame" class="menubuttons exit-game">Exit Game</button></a></li>
    </ul>
  </div>
  <div class="play-menu hide" id="play-menu">
    <h1 class="title hide">Play Menu</h1>
    <div>
      <img class="play-image" data-character="Mario" src="../images/Mario_idle_loop.gif" alt="Play Image">
      <img class="play-image hide" data-character="Wario" src="../images/Wario_idle_loop.gif" alt="Play Image">
      <img class="play-image hide" data-character="Waluigi" src="../images/Waluigi_idle_loop.gif" alt="Play Image">
      <img class="play-image hide" data-character="Luigi" src="../images/Luigi_idle_loop.gif" alt="Play Image">
    </div>
    <div class="timing-buttons">
      <button id="timing-button" class="timing-button-red"></button>
    </div>
    <div id="enemy">
      <img id="enemy-image" data-character="enemy" src="../images/azucena-lopez-robot02-movemment (2).gif" alt="enemy Image">
    </div>
    <div id="Scoreboard"><p id="Score">0</p></div>
    
  </div>
  <div class="customize-menu hide" id="customize-menu">
  <h1 class="title"></h1>
  <ul id="character-options">
    <li><button class="optionbutton options" data-character="Mario"><img class="character-image1" src="../images/Mario_idle_loop.gif" alt="Mario">Mario</button></li>
    <li><button class="optionbutton options" data-character="Wario"><img class="character-image2" src="../images/Wario_idle_loop.gif" alt="Wario">Wario</button></li>
    <li><button class="optionbutton options" data-character="Waluigi"><img class="character-image3" src="../images/Waluigi_idle_loop.gif" alt="Waluigi">Waluigi</button></li>
    <li><button class="optionbutton options" data-character="Luigi"><img class="character-image4" src="../images/Luigi_idle_loop.gif" alt="Luigi">Luigi</button></li>
  </ul>
  <p id="result">None selected</p>
  </div>
  <div class="credits-menu hide" id="credits-menu">
    <h1 class="title">Credits Menu</h1>
    <h2 class="text"><br>Pientje09<br><br>Rubyfire</h2>
  </div>
  <div id="you-died" class="hide">
  <div class="buttons">
    <ul>
      <div class="you-died">WASTED</div>
      <div id="final-scoreboard">final score: <p id="finalScore">0</p></div>
      <li><a href="#play-again"><button class="wasted-buttons menubuttons" id="play-again">Play again</button></a></li>
      <li><a href="#menu"><button class="wasted-buttons menubuttons" id="menu">Menu</button></a></li>
    </ul>
  </div>
</div>
  <script src="../js/game.js"></script>
</body>
</html>
